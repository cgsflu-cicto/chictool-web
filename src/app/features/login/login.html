@if (desktop() && !currentUser()) {
    <div class="auth-backdrop">
        <form class="dialog auth-dialog" (ngSubmit)="hasUsers() ? signIn() : createAccount()">
            <p class="eyebrow">CHICTool App</p>
            <h2>{{ hasUsers() ? 'Sign in' : 'Create local account' }}</h2>
            <label
                >Username<input
                    pInputText
                    [(ngModel)]="authForm.username"
                    name="authUsername"
                    required
                    autocomplete="username"
            /></label>
            <label
                >Password<input
                    pInputText
                    [(ngModel)]="authForm.password"
                    name="authPassword"
                    type="password"
                    required
                    autocomplete="current-password"
            /></label>
            @if (authError()) {
                <p class="error-message">{{ authError() }}</p>
            }
            <p-button [label]="hasUsers() ? 'Sign in' : 'Create account'" type="submit" severity="primary" />
        </form>
    </div>
}
