<div class="shell" [hidden]="desktop() && !currentUser() && activeView() !== 'login'">
    <aside class="sidebar">
        <div class="brand">CHICTOOL</div>
        <p class="eyebrow"></p>
        <nav>
            <p-button
                label="Computers"
                icon="pi pi-th-large"
                iconPos="left"
                type="button"
                [text]="true"
                [class.active]="activeView() === 'inventory'"
                (onClick)="changeView('inventory')"
            />
            <p-button
                label="Peripherals"
                icon="pi pi-bars"
                iconPos="left"
                type="button"
                [text]="true"
                [class.active]="activeView() === 'peripherals'"
                (onClick)="changeView('peripherals')"
            />
            <p-button
                label="System"
                icon="pi pi-database"
                iconPos="left"
                type="button"
                [text]="true"
                [class.active]="activeView() === 'database'"
                (onClick)="changeView('database')"
            />
        </nav>
        <div class="sidebar-footer">
            <div class="workspace-status"><span class="status-dot"></span> Local workspace</div>
            @if (currentUser()) {
                <div class="sidebar-user">
                    <span class="user-label">{{ currentUser()?.username }}</span>
                    <p-button
                        label="Sign out"
                        type="button"
                        severity="secondary"
                        [outlined]="true"
                        (onClick)="session.signOut()"
                    />
                </div>
            }
        </div>
    </aside>
    <main>
        <header>
            <div>
                <p class="eyebrow">CHICTool | CICTO Hardware Inventory Capturing Tool</p>
            </div>
        </header>
        @if (authError() && currentUser()) {
            <p class="error-banner">
                {{ authError()
                }}<p-button label="Dismiss" type="button" severity="danger" [text]="true" (onClick)="dismissError()" />
            </p>
        }
        <router-outlet />
    </main>
</div>
